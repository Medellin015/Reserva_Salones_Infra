# Lee los calendarios publicados de las cuatro salas y actualiza disponibilidad.js,
# que es lo que pinta el calendario de la página. Solo hace commit cuando algo cambió.
# Se dispara de cuatro formas:
#   - El flujo de reservas de Power Automate, al aprobar una reserva, con la acción de
#     GitHub "Create a repository dispatch event" (tipo actualizar-disponibilidad).
#     Es lo que hace que una reserva aparezca en uno a tres minutos.
#   - El flujo "Revisar disponibilidad salas" de Power Automate, cada 10 minutos en horario
#     hábil (tipo revisar-disponibilidad), para recoger reservas borradas o movidas a mano.
#   - El temporizador de GitHub cada 5 minutos, como respaldo; GitHub no garantiza la hora
#     exacta de estas ejecuciones y a veces no las dispara.
#   - A mano, desde la pestaña Actions → "Actualizar disponibilidad" → "Run workflow".
# GitHub desactiva las tareas programadas de un repositorio público tras 60 días sin
# actividad; si pasa, se reactivan desde la pestaña Actions con un clic.
name: Actualizar disponibilidad

on:
  repository_dispatch:
    types: [actualizar-disponibilidad, revisar-disponibilidad]
  schedule:
    # Cada 5 minutos de 06:02 a 18:57 de Bogotá (UTC-5) = 11:02 a 23:57 UTC, de lunes a viernes.
    # Los minutos 2, 7, 12... esquivan el :00, :15, :30 y :45, que es cuando GitHub tiene más
    # carga y retrasa o descarta las tareas programadas (así lo advierte su documentación).
    - cron: '2-59/5 11-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disponibilidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      RAMA: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Outlook tarda un poco en incluir una reserva nueva en el calendario publicado; cuando
      # el flujo de reservas avisa de una, se espera medio minuto antes de leer.
      - name: Esperar a que Outlook publique la reserva
        if: github.event_name == 'repository_dispatch' && github.event.action == 'actualizar-disponibilidad'
        run: sleep 30

      - name: Leer los calendarios y publicar si cambió
        id: leer
        run: scripts/publicar-disponibilidad.sh

      # Segunda lectura por si la reserva todavía no estaba publicada en la primera.
      - name: Volver a leer dos minutos después
        if: github.event_name == 'repository_dispatch' && github.event.action == 'actualizar-disponibilidad'
        run: |
          sleep 120
          scripts/publicar-disponibilidad.sh

      # Queda en rojo una sola vez al día (a partir de las 09:00 de Bogotá) si en todo el día
      # no se ha podido leer ningún calendario; así GitHub avisa por correo sin inundar.
      - name: Avisar si hoy no se ha podido leer ningún calendario
        if: steps.leer.outputs.avisar_fallo == 'true'
        run: |
          echo "::error::Hoy no se ha podido leer ningún calendario. La página muestra el aviso y los enlaces a Outlook."
          exit 1
