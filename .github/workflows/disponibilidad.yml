# Lee los calendarios publicados de las cuatro salas y actualiza disponibilidad.js,
# que es lo que pinta el calendario de la página. Corre cada 5 minutos en horario
# hábil de Bogotá y solo hace commit cuando algo cambió.
# GitHub desactiva las tareas programadas de un repositorio público tras 60 días sin
# actividad; si pasa, se reactivan desde la pestaña Actions con un clic.
name: Actualizar disponibilidad

on:
  schedule:
    # Cada 5 minutos de 06:02 a 18:57 de Bogotá (UTC-5) = 11:02 a 23:57 UTC, de lunes a viernes.
    # Los minutos 2, 7, 12... esquivan el :00, :15, :30 y :45, que es cuando GitHub tiene más
    # carga y retrasa o descarta las tareas programadas (así lo advierte su documentación).
    # Aun así GitHub no garantiza la hora exacta; por eso son tan seguidas.
    - cron: '2-59/5 11-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disponibilidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Leer los calendarios publicados
        id: leer
        run: node scripts/actualizar-disponibilidad.js

      - name: Publicar disponibilidad.js si cambió
        run: |
          if git diff --quiet -- disponibilidad.js; then
            echo "Sin cambios: no hay nada que publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disponibilidad.js
          git commit -m "Disponibilidad: $(TZ=America/Bogota date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # Queda en rojo una sola vez al día (en la ejecución de las 09:00 de Bogotá) si en
      # todo el día no se ha podido leer ningún calendario; así GitHub avisa por correo
      # sin mandar un correo por cada ejecución fallida.
      - name: Avisar si hoy no se ha podido leer ningún calendario
        if: steps.leer.outputs.avisar_fallo == 'true'
        run: |
          echo "::error::Hoy no se ha podido leer ningún calendario. La página muestra el aviso y los enlaces a Outlook."
          exit 1
